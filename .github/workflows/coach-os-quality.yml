name: Coach OS quality gate
on:
  pull_request:
  push:
    branches: [main, 'release/**']
permissions:
  contents: read
concurrency:
  group: coach-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Security, device and integration regression tests
        run: npm test
      - name: Production build and TypeScript validation
        run: npm run build
      - name: Standalone TypeScript validation
        run: npm run typecheck
